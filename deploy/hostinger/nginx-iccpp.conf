# Public site lives on the apex host only.
server {
    listen 80;
    listen [::]:80;
    server_name iccppglobal.com;

    client_max_body_size 22m;

    location / {
        include proxy_params;
        proxy_pass http://unix:/var/www/iccpp/iccpp.sock;
    }
}

# Keep www as a redirect so old bookmarks still reach the site.
server {
    listen 80;
    listen [::]:80;
    server_name www.iccppglobal.com;
    return 301 $scheme://iccppglobal.com$request_uri;
}
