<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submission status — ICCPP</title>
  <meta name="description" content="Check the status of a paid ICCPP Journal submission.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=22">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker">Journal</p>
        <h1>Track a submission</h1>
        <p class="lead">Enter the reference from your confirmation and the email you used on the form.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap narrow">
        <form class="form" id="status-form">
          <label>Reference <input name="id" type="text" required placeholder="inq-…"></label>
          <label>Email <input name="email" type="email" required></label>
          <button class="btn" type="submit">Check status</button>
          <p class="form-status" id="status-result" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="js/chrome.js?v=20"></script>
  <script src="js/main.js?v=13"></script>
  <script src="js/status.js?v=1"></script>
</body>
</html>
